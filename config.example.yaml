# Paper Gleaner 配置示例
# 使用方法：复制为 config.yaml 后按需修改。密钥（API Key 等）不要写在这里，请配置为 GitHub Secrets。

language: zh                       # 输出语言
timezone: Asia/Shanghai

sources:
  arxiv:
    categories: [cs.CL, cs.LG, cs.AI]
    include_cross_list: true       # 是否包含从其它分类交叉投递过来的论文
    include_replace: false         # 是否包含旧论文的新版本

profile:
  interests_file: profile/interests.md
  zotero:
    enabled: false                 # 启用时需要 ZOTERO_ID / ZOTERO_KEY

filters:
  include_keywords: []             # 命中即进入精排
  exclude_keywords: []             # 命中即排除

ranking:
  coarse_top_k: 50                 # 向量粗筛保留的篇数
  final_top_n: 10                  # 最终推送的最多篇数
  min_score: 6                     # LLM 打分（0–10）低于此值不推送
  weights: {interest: 1.0, positive: 0.6, zotero: 0.5, negative: 0.8}
  feedback_half_life_days: 90      # 反馈的时间衰减半衰期
  embedding:
    provider: local                # local（fastembed 本地推理）| api（OpenAI 兼容 embeddings 接口）
    model: BAAI/bge-small-en-v1.5

deep_read:
  auto_top_m: 1                    # 日报中自动深读的篇数，0 表示关闭
  max_input_tokens: 30000

llm:
  base_url: https://api.deepseek.com   # 也可以用环境变量 LLM_BASE_URL 覆盖
  models:                          # 模型名以服务商当前提供的为准
    fast: deepseek-chat            # 兴趣拆解、精排、偏好总结
    deep: deepseek-reasoner        # 深读、对比、/ask
  daily_token_budget: 500000       # 超出后自动降级
  timeout_seconds: 60
  max_retries: 3

notify:
  github_issue:
    enabled: true
    per_paper_comment: true        # 每篇论文一条评论，便于逐篇反馈
    close_after_days: 7            # 自动关闭旧日报（关闭后仍可评论交互）
  email:  {enabled: false}
  feishu: {enabled: false}
  wecom:  {enabled: false}
