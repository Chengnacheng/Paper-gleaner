# Paper Gleaner 配置
language: zh
timezone: Asia/Shanghai

sources:
  arxiv:
    categories: [cs.CV, cs.LG]
    include_cross_list: true
    include_replace: false

profile:
  interests_file: profile/interests.md
  zotero:
    enabled: false

filters:
  include_keywords: []
  exclude_keywords: []

ranking:
  coarse_top_k: 50
  final_top_n: 10
  min_score: 6
  weights: {interest: 1.0, positive: 0.6, zotero: 0.5, negative: 0.8}
  feedback_half_life_days: 90
  embedding:
    provider: local
    model: BAAI/bge-small-en-v1.5

deep_read:
  auto_top_m: 1
  max_input_tokens: 30000

llm:
  base_url: https://api.deepseek.com
  models:
    fast: deepseek-chat
    deep: deepseek-reasoner
  daily_token_budget: 500000
  timeout_seconds: 60
  max_retries: 3

notify:
  github_issue:
    enabled: true
    per_paper_comment: true
    close_after_days: 7
  email: {enabled: false}
  feishu: {enabled: false}
  wecom: {enabled: false}
